[server]
headless = true
enableStaticServing = false
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 0

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#087F73"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14273B"
font = "sans serif"
borderColor = "#D9E3EB"
showWidgetBorder = true
