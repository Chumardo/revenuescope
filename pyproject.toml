[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "revenuescope"
version = "0.1.0"
description = "Reproducible revenue intelligence and decision analytics for synthetic ecommerce data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
app = ["streamlit==1.67.0", "plotly==6.9.0"]

[project.scripts]
revenuescope = "revenuescope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revenuescope = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

